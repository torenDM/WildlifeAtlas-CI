name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Wildlife Atlas
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Check project
        run: xcodebuild -list -project WildlifeAtlas.xcodeproj

      - name: Build application
        run: |
          xcodebuild \
            -project WildlifeAtlas.xcodeproj \
            -target WildlifeAtlas \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # Находим собранный Simulator .app и упаковываем его
      # в ZIP, который можно загрузить в Appetize.
      - name: Prepare simulator build
        run: |
          APP_PATH=$(find build -type d -name "WildlifeAtlas.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "WildlifeAtlas.app was not found"
            exit 1
          fi

          echo "Found app at: $APP_PATH"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            WildlifeAtlas-Simulator.zip

          ls -lh WildlifeAtlas-Simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: WildlifeAtlas-Simulator
          path: WildlifeAtlas-Simulator.zip
          if-no-files-found: error
          retention-days: 7